name: build
on:
  push:
    branches: [sse-isolated]
    tags: ['v*-sse.*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sse-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
env:
  FLUTTER_VERSION: '3.47.1'
  GO_VERSION: '1.26.4'
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Generate test sources without release hooks
        run: |
          node -e "const fs=require('fs');fs.writeFileSync('pubspec.yaml',fs.readFileSync('pubspec.yaml','utf8').replace('build_assets: true','build_assets: false'))"
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs
          dart format lib test
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Fast SSE feature regression
        run: flutter test test/common/sse_history_test.dart test/providers/sse_startup_test.dart test/views/sse_dialog_test.dart --reporter expanded
      - name: Full upstream Dart regression and coverage floors
        run: |
          flutter test --coverage --reporter expanded
          dart run tool/check_coverage.dart coverage/lcov.info 75
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dart-coverage
          path: coverage/lcov.info
  windows:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            services/helper
            plugins/rust_api/rust
      - name: Synthetic source protocol and cancellation tests
        run: node --test sse-source/worker.test.mjs
      - name: Go regression and 1024-node 20-second acceptance
        working-directory: core
        env:
          CGO_ENABLED: 0
        run: |
          go test -count=1 -v . ./ssebench
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go vet . ./ssebench
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Dependencies and source generation
        shell: pwsh
        run: |
          flutter pub get
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $p = Get-Content pubspec.yaml -Raw
          $p.Replace('build_assets: true', 'build_assets: false') | Set-Content pubspec.yaml
          dart run build_runner build --delete-conflicting-outputs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dart format lib test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --binary -- lib test > generated.patch
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: generated-source
          path: generated.patch
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Windows SSE and native lifecycle regression
        env:
          SSE_CAPTURE_UI: 'true'
        run: flutter test test/common/sse_history_test.dart test/providers/sse_startup_test.dart test/views/sse_dialog_test.dart test/core/desktop --reporter expanded
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sse-ui-acceptance
          path: test-output/*.png
      - name: Restore release build hooks
        if: always()
        run: git checkout -- pubspec.yaml
      - name: Package isolated installer using upstream setup pipeline
        run: dart setup.dart windows --env stable -v
      - name: Native system-proxy ownership and coexistence regression
        run: |
          cmake -S windows -B build/windows/x64 -Dinclude_proxy_tests=ON -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build/windows/x64 --config Release --target proxy_test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir build/windows/x64/plugins/proxy -C Release --output-on-failure --no-tests=error
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Installer isolation, installed-core SSE, restart and uninstall acceptance
        run: ./tool/verify-windows-install.ps1
      - name: Hash assets
        run: |
          $assets = @(Get-ChildItem dist -Recurse -File | Where-Object { $_.Extension -in '.exe', '.zip' })
          if ($assets.Count -lt 2) { throw 'Installer and portable archive were not both produced' }
          New-Item -ItemType Directory -Force release | Out-Null
          $assets | Copy-Item -Destination release
          Get-ChildItem release -File | ForEach-Object { '{0}  {1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name } | Set-Content release/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: FlClash-SSE-windows-amd64
          path: release/*
          retention-days: 14
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [test, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: FlClash-SSE-windows-amd64
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          name: FlClash SSE isolated Windows
          body: 'Isolated Windows installer. Synthetic SSE tok/s only; 8-second workload, 20-second batch deadline, persistent last valid scores and startup candidate selection. Separate app data and protocol registration; never overwrites original FlClash.'
          files: dist/*
