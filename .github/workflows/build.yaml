name: build
on:
  push:
    branches: [sse-isolated]
    tags: ['v*-sse.*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sse-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
env:
  FLUTTER_VERSION: '3.47.1'
  GO_VERSION: '1.26.4'
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            services/helper
            plugins/rust_api/rust
      - name: Go regression and 1024-node 20-second acceptance
        working-directory: core
        env:
          CGO_ENABLED: 0
        run: |
          go test -count=1 -v . ./ssebench
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go vet . ./ssebench
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Dependencies and source generation
        shell: pwsh
        run: |
          flutter pub get
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $p = Get-Content pubspec.yaml -Raw
          $p.Replace('build_assets: true', 'build_assets: false') | Set-Content pubspec.yaml
          dart run build_runner build --delete-conflicting-outputs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dart format lib test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --binary -- lib test > generated.patch
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: generated-source
          path: generated.patch
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Dart regression
        run: flutter test --reporter expanded
      - name: Restore release build hooks
        if: always()
        run: git checkout -- pubspec.yaml
      - name: Package isolated installer using upstream setup pipeline
        run: dart setup.dart windows --env stable -v
      - name: Hash assets
        run: |
          Get-ChildItem dist -File | ForEach-Object { '{0}  {1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name } | Set-Content dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: FlClash-SSE-windows-amd64
          path: dist/*
          retention-days: 14
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: FlClash-SSE-windows-amd64
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          name: FlClash SSE isolated Windows
          body: 'Isolated Windows installer. Synthetic SSE tok/s only; 8-second workload, 20-second batch deadline, persistent last valid scores and startup candidate selection. Separate app data and protocol registration; never overwrites original FlClash.'
          files: dist/*
